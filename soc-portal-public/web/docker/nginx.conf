# soc-web: sirve la interfaz React y reenvía la API a soc-bridge (FastAPI).
# El puerto 8088 se mantiene, así que las URL del equipo, de Shuffle y de Wazuh no cambian.
server_tokens off;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream bridge { server soc-bridge:8088; keepalive 16; }

server {
  listen 8088;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1024m;        # cargas de IoC de millones de líneas y archivos de herramientas

  # ---------- cabeceras de seguridad ----------
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

  # ---------- API y autenticación → backend ----------
  location ~ ^/(portal/(api|auth|data)|feeds|health|api/soc)(/|$) {
    proxy_pass http://bridge;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;         # consultas largas al indexer y al asistente de IA
    proxy_request_buffering off;     # subidas grandes en streaming
  }

  # La raíz lleva al portal
  location = / { return 302 /portal/; }

  # ---------- interfaz (SPA, compilada con base /portal/) ----------
  location ^~ /portal/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
  location /portal/ {
    try_files $uri $uri/ /portal/index.html;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  }
}
