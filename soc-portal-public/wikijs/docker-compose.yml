# Wiki.js 2.x + PostgreSQL
services:
  wiki-db:
    image: postgres:15-alpine
    container_name: wiki-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wikijs
      POSTGRES_PASSWORD: ${WIKI_DB_PASSWORD}
    volumes:
      - wiki-db-data:/var/lib/postgresql/data
    networks: [soc-net]

  wikijs:
    image: ghcr.io/requarks/wiki:2
    container_name: wikijs
    restart: unless-stopped
    depends_on: [wiki-db]
    environment:
      DB_TYPE: postgres
      DB_HOST: wiki-db
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS: ${WIKI_DB_PASSWORD}
      DB_NAME: wiki
    ports:
      - "3000:3000"
    volumes:
      - ./backup:/wiki-backup      # destino de Admin → Storage → Local File System
    networks: [soc-net]

volumes:
  wiki-db-data:

networks:
  soc-net:
    external: true
