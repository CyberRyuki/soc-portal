<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal SOC · ACME</title>
<script>try{var t=localStorage.getItem("soc-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{
  color-scheme:light;
  --bg:#f6f7fb; --card:#ffffff; --ink:#151a2d; --muted:#667085; --line:#e6e8f0; --grid:#eef0f5;
  --brand:#2f5bea; --brand-soft:#eef2ff; --ok:#0ca30c; --ok-soft:#ecfdf3;
  --warn:#b26b00; --warn-soft:#fffaeb; --bad:#d03b3b; --bad-soft:#fef3f2;
  /* datos: categóricos validados (slot 1 y 2), estado y rampa secuencial azul */
  --s1:#2a78d6; --s2:#eb6834; --s-neutral:#98a2b3;
  --st-good:#0ca30c; --st-warn:#fab219; --st-serious:#ec835a; --st-crit:#d03b3b;
  --q1:#cde2fb; --q2:#9ec5f4; --q3:#6da7ec; --q4:#3987e5; --q5:#256abf; --q6:#184f95; --q7:#0d366b;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.06); --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0d1120; --card:#151a2d; --ink:#eef0f7; --muted:#98a2b3; --line:#262c44; --grid:#1f2539;
  --brand:#7c9bff; --brand-soft:#1d2550; --ok:#3ccb3c; --ok-soft:#0d2b1f; --warn:#fab219; --warn-soft:#2e2208; --bad:#ef6b6b; --bad-soft:#331414;
  --s1:#3987e5; --s2:#d95926; --s-neutral:#5d6680;
  --q1:#1a2747; --q2:#104281; --q3:#184f95; --q4:#256abf; --q5:#3987e5; --q6:#6da7ec; --q7:#b7d3f6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d1120; --card:#151a2d; --ink:#eef0f7; --muted:#98a2b3; --line:#262c44; --grid:#1f2539;
  --brand:#7c9bff; --brand-soft:#1d2550; --ok:#3ccb3c; --ok-soft:#0d2b1f; --warn:#fab219; --warn-soft:#2e2208; --bad:#ef6b6b; --bad-soft:#331414;
  --s1:#3987e5; --s2:#d95926; --s-neutral:#5d6680;
  --q1:#1a2747; --q2:#104281; --q3:#184f95; --q4:#256abf; --q5:#3987e5; --q6:#6da7ec; --q7:#b7d3f6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:14.5px/1.5 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:22px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel{padding:18px}
.muted{color:var(--muted)} .mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.err{color:var(--bad);font-size:13px}
h1.page{font-size:22px;margin:8px 4px 2px}
.sub{color:var(--muted);margin:0 4px 16px;font-size:13.5px}
h2{font-size:16px;margin:26px 4px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h2 small{font-size:12.5px;font-weight:400;color:var(--muted)}
h3{margin:0 0 10px;font-size:14.5px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h3 small{font-weight:400;color:var(--muted);font-size:12px}
/* rejilla */
.g{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g21{grid-template-columns:2fr 1fr} .g12{grid-template-columns:1fr 2fr}
.span2{grid-column:span 2}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpis.home5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1000px){.kpis.home5{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px 16px;display:block;transition:transform .15s,box-shadow .15s}
a.kpi:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(16,24,40,.12)}
.kpi .t{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:26px;font-weight:700;line-height:1.2;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .h{font-size:12px;color:var(--muted)}
.kpi.alert{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))} .kpi.alert .v{color:var(--bad)}
.ico{width:16px;height:16px;flex:none}
/* pastillas y botones */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--brand-soft);color:var(--brand)} .pill.gray{background:var(--grid);color:var(--muted)}
.sev-Critical,.st-Open{background:var(--bad-soft);color:var(--bad)} .sev-High,.st-Investigating{background:var(--warn-soft);color:var(--warn)}
.sev-Medium,.st-Contained{background:var(--brand-soft);color:var(--brand)} .sev-Low,.st-Closed{background:var(--ok-soft);color:var(--ok)}
.go{font-size:13px;font-weight:600;color:var(--brand)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:8px 13px;border-radius:10px;font:600 13.5px/1 inherit;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand)} .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.sm{padding:6px 10px;font-size:12.5px}
.chips{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.chips button{border:0;background:none;padding:7px 12px;font:600 13px/1 inherit;color:var(--muted);cursor:pointer}
.chips button.on{background:var(--brand-soft);color:var(--brand)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.toolbar .grow{flex:1}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 5px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px} .form .full{grid-column:1/-1}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
/* tablas y listas */
.table{width:100%;border-collapse:collapse;font-size:13.5px}
.table th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.table td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.table tr:last-child td{border-bottom:0}
.table tr.click{cursor:pointer} .table tr.click:hover td{background:var(--brand-soft)}
.table td.n,.table th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow:auto;max-height:440px}
.hb{list-style:none;margin:0;padding:0}
.hb li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:6px 4px;border-radius:8px;font-size:13px}
.hb li.click{cursor:pointer} .hb li.click:hover{background:var(--brand-soft)}
.hb .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb b{font-variant-numeric:tabular-nums;font-weight:600}
.hb .bar{grid-column:1/-1;height:6px;border-radius:4px;background:var(--grid);overflow:hidden}
.hb .bar i{display:block;height:100%;border-radius:4px;background:var(--s1)}
/* ranking (reglas, equipos) */
.rank{list-style:none;margin:0;padding:0;counter-reset:r}
.rank li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:9px 6px;border-radius:12px}
.rank li+li{border-top:1px solid var(--line)}
.rank li.click{cursor:pointer} .rank li.click:hover{background:var(--brand-soft)}
.rank .n{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--grid);color:var(--muted)}
.rank li:nth-child(-n+3) .n{background:linear-gradient(135deg,#2f5bea,#7a5af8);color:#fff}
.rank .lb{min-width:0} .rank .lb b{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .lb small{color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center}
.rank .val{text-align:right;font-variant-numeric:tabular-nums} .rank .val b{font-size:15px} .rank .val small{display:block;color:var(--muted);font-size:11.5px}
.rank .bar{grid-column:2/-1;height:8px;border-radius:6px;background:var(--grid);overflow:hidden}
.rank .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--s1),color-mix(in srgb,var(--s1) 60%,#7a5af8))}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 2px;border-top:1px solid var(--line);font-size:13px}
.feed li:first-child{border-top:0}
.lv{min-width:30px;text-align:center;font-weight:700;border-radius:8px;padding:2px 6px;font-size:12.5px;color:#fff}
.lv.c{background:var(--st-crit)} .lv.s{background:var(--st-serious);color:#2a1206} .lv.w{background:var(--st-warn);color:#2a1d00} .lv.n{background:var(--s-neutral)}
.empty{padding:26px;text-align:center;color:var(--muted)}
.skel{height:180px;border-radius:12px;background:linear-gradient(90deg,var(--grid),var(--card),var(--grid));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
/* gráficos */
.viz{position:relative;width:100%}
.viz svg{display:block;width:100%;overflow:visible}
.viz text{fill:var(--muted);font-size:11px}
.viz .gl{stroke:var(--grid);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{color:var(--ink);font-weight:600}
.donut{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.donut ul{list-style:none;margin:0;padding:0;font-size:13px}
.donut li{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;padding:4px 0}
.donut li i{width:12px;height:12px;border-radius:3px}
.donut li b{font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-columns:34px repeat(24,minmax(0,1fr));gap:2px;font-size:10.5px;color:var(--muted)}
.heat div{height:18px;border-radius:3px}
.heat .l{height:auto;display:flex;align-items:center}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:9px;font-size:12.5px;line-height:1.4;opacity:0;transition:opacity .1s;max-width:300px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#tip.on{opacity:1}
/* cabecera */
.topbar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1280px;margin:0 auto;padding:9px 16px 6px;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap;flex:1}
.brand i{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#2f5bea,#7a5af8);color:#fff;font-style:normal}
.tabs{display:flex;flex-wrap:wrap;gap:2px 4px;order:9;flex-basis:100%;margin:0 -4px}
.tabs a{padding:7px 9px;border-radius:10px;color:var(--muted);font-weight:600;font-size:13.5px;white-space:nowrap}
.tabs a.on{background:var(--brand-soft);color:var(--brand)}
.who{position:relative;font-size:12.5px;white-space:nowrap}
.umenu{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:12px;padding:4px 10px 4px 4px;cursor:pointer;font:inherit}
.umenu .un{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15} .umenu .un b{color:var(--ink);font-size:13px} .umenu .un small{font-size:11px}
.av{width:30px;height:30px;border-radius:9px;display:inline-grid;place-items:center;flex:none;background:linear-gradient(135deg,#2f5bea,#7a5af8);color:#fff;font-weight:700;font-size:12px}
.dd{display:none;position:absolute;right:0;top:calc(100% + 6px);min-width:240px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(16,24,40,.16);padding:6px;z-index:30}
.dd.on{display:block} .dd a{display:block;padding:9px 10px;border-radius:9px;color:var(--ink);font-size:13.5px} .dd a:hover{background:var(--brand-soft)}
.ddh{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px} .ddh b{display:block;color:var(--ink)} .ddh small{color:var(--muted)}
body.role-viewer .topbar .btn.primary{display:none}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:600;background:var(--card)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)} .dot.ok{background:var(--st-good)} .dot.bad{background:var(--st-crit)}
.hero{padding:24px 26px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;color:#fff;border:0;
  background:radial-gradient(circle at 85% 0%,rgba(122,90,248,.55),transparent 55%),linear-gradient(120deg,#16205a,#2f3fb0 60%,#4b3bc4)}
.hero h1{margin:0;font-size:23px;display:flex;align-items:center;gap:12px}
.hero .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.14)}
.hero .sub2{color:rgba(255,255,255,.75);font-size:13.5px;margin-top:4px}
.hero .badge{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
.hero .state{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px;background:rgba(255,255,255,.14)}
.hero .state.bad{background:#d03b3b} .hero .state.ok{background:rgba(12,163,12,.85)}
.svc{padding:14px;display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;transition:transform .15s}
.svc:hover{transform:translateY(-2px)}
.thumb{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.svc h4{margin:0;font-size:14px} .svc p{margin:0;color:var(--muted);font-size:12.5px}
/* incidentes, runbooks, modal */
.detail{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 16px 22px;border-left:2px solid var(--line);margin-left:6px}
.timeline li::before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--brand)}
.timeline li.note::before{background:var(--st-good)} .timeline li.status::before{background:var(--st-warn)}
.timeline .meta{font-size:12px;color:var(--muted)}
.md{line-height:1.65} .md h1{font-size:21px} .md h2{font-size:16.5px;margin-top:22px;display:block}
.md table{border-collapse:collapse} .md td,.md th{border:1px solid var(--line);padding:6px 10px}
.md a{color:var(--brand);font-weight:600}
.md pre{background:var(--grid);padding:12px 14px;border-radius:10px;overflow:auto} .md pre code{background:none;padding:0}
.md code{background:var(--brand-soft);padding:1px 5px;border-radius:5px;font-size:12.5px}
.md blockquote{margin:12px 0;padding:10px 14px;border-left:4px solid var(--brand);background:var(--brand-soft);border-radius:10px}
.editor{display:grid;grid-template-columns:1fr 1fr;gap:14px} .editor textarea{min-height:420px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.rb{padding:16px;display:block} .rb h4{margin:0 0 4px;font-size:15px} .rb p{margin:0 0 10px;color:var(--muted);font-size:13px}
/* matriz ATT&CK */
.matrix{display:grid;grid-template-columns:repeat(15,minmax(150px,1fr));gap:6px;overflow-x:auto;padding-bottom:8px}
.mcol{display:flex;flex-direction:column;gap:4px;min-width:150px}
.mhead{position:sticky;top:0;background:var(--brand-soft);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:2px;font-size:12.5px;min-height:62px}
.mhead small{color:var(--muted);font-size:11px}
.mcell{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:6px 7px;font-size:11.5px;line-height:1.3;color:var(--ink);position:relative}
.mcell:hover{outline:2px solid var(--brand)}
.mcell .mid{display:block;font:600 10.5px ui-monospace,Consolas,monospace;opacity:.75}
.mcell .mn{position:absolute;top:5px;right:6px;font-weight:700;font-size:10.5px}
.owid{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#2f5bea,#7a5af8);color:#fff;font-weight:800;font-size:14px;flex:none}
.md input[type=checkbox]{width:auto;margin-right:6px;transform:translateY(1px)} .md li:has(> input[type=checkbox]){list-style:none;margin-left:-18px}
/* visor de código */
.code{display:grid;grid-template-columns:auto minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:75vh;background:var(--card)}
.code pre{margin:0;padding:12px 14px;font:12.5px/1.55 ui-monospace,Consolas,"Cascadia Code",monospace;white-space:pre;tab-size:4}
.code .gut{text-align:right;color:var(--muted);background:var(--grid);user-select:none;border-right:1px solid var(--line);position:sticky;left:0}
.tk-c{color:#5b735b;font-style:italic} .tk-s{color:#a4470f} .tk-k{color:#6d32c4;font-weight:600} .tk-n{color:#0a6b9b}
:root[data-theme="dark"] .tk-c{color:#8fa98f} :root[data-theme="dark"] .tk-s{color:#f0a36b} :root[data-theme="dark"] .tk-k{color:#c3a0ff} :root[data-theme="dark"] .tk-n{color:#6fc3f0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tk-c{color:#8fa98f}:root:not([data-theme="light"]) .tk-s{color:#f0a36b}:root:not([data-theme="light"]) .tk-k{color:#c3a0ff}:root:not([data-theme="light"]) .tk-n{color:#6fc3f0}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(10,14,30,.5);display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:40;overflow:auto}
.modal.on{display:flex} .modal .card{width:100%;max-width:760px;padding:22px} .modal.wide .card{max-width:1100px}
.search{display:flex;gap:8px} .search input{font-size:16px;padding:12px 14px}
/* modo NOC */
body.noc .topbar{display:none}
body.noc .wrap{max-width:none;padding:16px 20px}
.nocbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.nocbar h1{margin:0;font-size:24px}
.clock{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
body.noc .kpi .v{font-size:38px}
body.noc .feed li{font-size:14.5px}
.noc-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.c3{grid-column:span 3} .c4{grid-column:span 4} .c5{grid-column:span 5} .c6{grid-column:span 6} .c7{grid-column:span 7} .c8{grid-column:span 8} .c12{grid-column:span 12}
